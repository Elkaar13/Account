<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0f17" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Mon Budget</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--good:#16a34a;--chip:#eef2ff;--soft:#f9fafb;--in:#16a34a;--out:#374151;--danger:#dc2626;--vigil:#d97706;--tr:#2563eb}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f17;--card:#151b26;--text:#e5e7eb;--muted:#9ca3af;--line:#263041;--accent:#60a5fa;--good:#22c55e;--chip:#1e293b;--soft:#111722;--in:#22c55e;--out:#cbd5e1;--danger:#f87171;--vigil:#f59e0b;--tr:#60a5fa}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:pan-x pan-y}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;overflow-x:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html{height:100%}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(74px + env(safe-area-inset-bottom));max-width:100vw;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
.hide .m{filter:blur(7px)}
.eye{position:absolute;z-index:3;top:12px;right:12px;background:rgba(255,255,255,.18);border:0;color:#fff;width:34px;height:34px;border-radius:50%;font-size:16px;display:flex;align-items:center;justify-content:center}
.hero{position:relative}
.search{margin-bottom:10px}
.toolbar{display:flex;gap:8px;margin-bottom:10px}
.toolbar select{flex:1;min-height:40px;padding:8px 30px 8px 10px;font-size:15px}
.catchips{display:flex;flex-wrap:wrap;gap:6px}
.catchips .chip{padding:6px 10px;font-size:13px}
.newcat{display:flex;gap:6px;margin-top:8px}
.newcat input{flex:1}
.colrow{display:flex;align-items:center;justify-content:space-between;margin:10px 0}
.colrow input[type=color]{width:56px;height:36px;padding:2px;min-height:0;border-radius:8px}
.stack{display:flex;height:10px;border-radius:6px;overflow:hidden;margin-top:6px;border:1px solid var(--line)}
.stack i{display:block;height:100%}
.calcrow{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.calcrow:last-child{border-bottom:0}
.calcrow.total{font-weight:800;font-size:17px;border-top:2px solid var(--line);border-bottom:0;padding-top:10px;margin-top:4px}
.danger{color:var(--danger)}.vigil{color:var(--vigil)}
.editbar{position:sticky;top:env(safe-area-inset-top);z-index:6;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border:1px solid var(--accent);border-radius:14px;padding:8px 8px 8px 12px;margin:12px 0;font-size:13px}
.blk{position:relative}
.blk.jiggle{animation:jig .28s infinite alternate ease-in-out;border:1px dashed var(--line);border-radius:16px;padding:0 8px 4px;margin-top:14px}
.blk.jiggle:nth-child(even){animation-delay:.14s}
.blk.jiggle *{pointer-events:none}
.blk.jiggle .blk-x,.blk.jiggle .blk-h{pointer-events:auto}
.blk.dragging{animation:none;opacity:.85;transform:scale(1.02);box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:5;background:var(--bg)}
@keyframes jig{from{transform:rotate(-.6deg)}to{transform:rotate(.6deg)}}
.blk-x{position:absolute;z-index:4;top:-10px;left:-8px;width:28px;height:28px;border-radius:50%;border:0;background:#6b7280;color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center}
.blk-h{position:absolute;z-index:4;top:14px;right:6px;font-size:22px;color:var(--muted);padding:4px 10px;touch-action:none;cursor:grab}
@media (prefers-reduced-motion:reduce){.blk.jiggle{animation:none}}
.lh{display:flex;align-items:center;justify-content:space-between}
.lh .icons{display:flex;gap:8px}
.ib{background:var(--card);border:1px solid var(--line);width:40px;height:40px;border-radius:12px;font-size:16px;color:var(--text);display:flex;align-items:center;justify-content:center;flex:none}
.ib.on{border-color:var(--accent);background:var(--chip)}
.qbox{display:flex;gap:8px;margin-bottom:10px}
.qbox input{flex:1}
.row.cr{padding:11px 14px}
.row.cr.open{background:var(--soft);border-bottom:0}
.dd{width:36px;font-size:12px;color:var(--muted);font-weight:700;text-align:center;flex:none}
.det{padding:0 14px 12px 60px;font-size:13px;color:var(--muted);background:var(--soft);border-bottom:1px solid var(--line);line-height:1.6}
input[type=checkbox]{-webkit-appearance:checkbox;appearance:auto;width:22px!important;height:22px;min-height:0;padding:0}
input[type=color]{-webkit-appearance:auto;appearance:auto;background:none;border:1px solid var(--line)}
body.noscroll{overflow:hidden}
main{max-width:640px;margin:0 auto;padding:10px 16px 90px}
h1{font-size:24px;margin:8px 0 12px}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:22px 0 8px}
h3{margin:0 0 6px;font-size:18px}
.muted{color:var(--muted)}
small{color:var(--muted);display:block;margin-top:4px;font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row:active{background:var(--soft)}
.grow{flex:1;min-width:0}
.t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s{font-size:12.5px;color:var(--muted)}
.note{font-style:italic}
.amt{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.in{color:var(--in)}.out{color:var(--out)}.tr{color:var(--tr)}
.ico{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:var(--soft);flex:none}
.ico.done{background:var(--chip)}
.tag{font-size:10.5px;background:var(--chip);color:var(--accent);padding:1px 6px;border-radius:8px;font-weight:600;vertical-align:middle}
.monthnav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
.monthnav b{font-size:18px}
.monthnav button{background:var(--card);border:1px solid var(--line);color:var(--text);width:40px;height:36px;border-radius:10px;font-size:20px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);padding:7px 12px;border-radius:20px;font-size:13.5px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.hero{border-radius:20px;padding:18px;color:#fff;margin-bottom:10px}
.hero.ok{background:linear-gradient(135deg,#1e3a8a,#2563eb)}
.hero.vigil{background:var(--vigil)}
.hero.danger{background:var(--danger)}
.hero.sav{background:linear-gradient(135deg,#15803d,#16a34a)}
.hero .lbl{font-size:13px;opacity:.9;padding-right:44px}
.hero .big{font-size:40px;font-weight:800;letter-spacing:-.02em;margin:2px 0 8px;font-variant-numeric:tabular-nums}
.hero .sub{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;opacity:.95}
.alert{border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px;border:1px solid}
.alert.danger{background:color-mix(in srgb,var(--danger) 12%,transparent);border-color:var(--danger)}
.alert.vigil{background:color-mix(in srgb,var(--vigil) 12%,transparent);border-color:var(--vigil)}
.alert.info{background:var(--chip);border-color:var(--accent)}
.btn{appearance:none;border:0;background:var(--accent);color:#fff;font:600 15px/1 inherit;padding:12px 16px;border-radius:12px;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:#dc2626}
.btn.sm{padding:8px 12px;font-size:13.5px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btns.two>.btn{flex:1}
.link{background:none;border:0;color:var(--accent);font:inherit;font-size:13px;padding:2px}
.segs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.segs::-webkit-scrollbar{display:none}
.seg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:none;color:var(--text);padding:8px;border-radius:8px;font:inherit}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:600}
.sum{font-size:14px;margin:0 2px 10px;color:var(--muted)}
.sum b{color:var(--text)}
.bar{height:8px;background:var(--soft);border-radius:6px;overflow:hidden;margin-top:6px;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar.over>i{background:var(--danger)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:9px 10px}
.kv span{display:block;font-size:12px;color:var(--muted)}
.kv b{font-variant-numeric:tabular-nums}
.chart{width:100%;height:auto;display:block}
.donutwrap{display:flex;gap:12px;align-items:center}
.donut{width:140px;flex:none}
.legend{flex:1;min-width:0;font-size:12.5px}
.legend div{display:flex;align-items:center;gap:6px;margin:3px 0}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{text-align:center;font-size:11.5px;color:var(--muted);padding:2px 0}
.cal .d{background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:52px;padding:4px;text-align:center;cursor:pointer}
.cal .d.today{border-color:var(--accent);border-width:2px}
.cal .d.sel{background:var(--chip)}
.cal .d.low{box-shadow:inset 0 -3px 0 var(--danger)}
.cal .d.lowv{box-shadow:inset 0 -3px 0 var(--vigil)}
.cal .n{font-size:13px;font-weight:600}
.cal .dots{display:flex;justify-content:center;gap:2px;margin-top:3px;flex-wrap:wrap}
.cal .dots i{width:6px;height:6px;border-radius:50%}
.cal .x{font-size:9.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden}
.daytitle{font-weight:700;margin:14px 2px 6px}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:5;border:0;background:var(--accent);color:#fff;font:700 15px inherit;padding:14px 18px;border-radius:28px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10}
.tabbar button{flex:1;border:0;background:none;color:var(--muted);padding:8px 0 6px;font:11px inherit;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar button.on{color:var(--accent)}
.tabbar svg{width:24px;height:24px}
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.open{display:block}
#sheet .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45)}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;background:var(--card);border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;-webkit-overflow-scrolling:touch}
#sheet .grab{width:40px;height:5px;background:var(--line);border-radius:3px;margin:0 auto 12px}
.fl{display:block;margin:12px 0}
.fl>span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:600}
input,select,textarea{width:100%;font:16px inherit;color:var(--text);background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:11px 12px;-webkit-appearance:none;appearance:none;min-height:44px}
input[type=date],input[type=month]{display:block}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.mgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.mchip{border:1px solid var(--line);background:var(--soft);color:var(--muted);border-radius:8px;padding:8px 0;font:13px inherit}
.mchip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.mini{margin-top:6px}
.subrow{display:flex;gap:6px;margin-bottom:6px}
.subrow input{flex:1}
.balrow{display:flex;align-items:center;gap:10px;margin:8px 0}
.balrow label{flex:1;font-size:14px}
.balrow input{width:140px;text-align:right}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
details>summary{cursor:pointer;color:var(--accent);font-weight:600;padding:8px 0;list-style:none}
details>summary::-webkit-details-marker{display:none}
.empty{padding:18px;text-align:center;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:1}
</style>
</head>

<script>
'use strict';
/* ================= Constantes & utilitaires ================= */
const KEY='monbudget.v1';
const MOIS=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const MC=['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Aoû','Sep','Oct','Nov','Déc'];
const CATS=['Logement','Énergie','Eau','Télécom & internet','Assurances','Impôts & taxes','Transport','Abonnements','Santé','Enfants','Banque','Divers'];
const SAVT={livret:'Livret (A, LDDS, LEP…)',pel:'PEL / CEL',pea:'PEA',av:'Assurance vie',per:'PER',autre:'Autre'};
const KN={charge:'Prélèvement',revenu:'Revenu',virement:'Virement',enveloppe:'Budget',loan:'Crédit',oneoff:'Opération ponctuelle',saving:'Épargne'};
const PAL=['#2563eb','#7c3aed','#0891b2','#16a34a','#d97706','#db2777','#65a30d','#475569','#0d9488','#9333ea','#ca8a04','#4f46e5'];
let S, memo={}, bmemo={}, FORM=null;
const ui={edit:false,tab:'home',ym:null,scope:'all',seg:'charge',calDay:null,lineAcc:null,sort:'jour',q:'',repMode:'mois',exp:null,qOpen:false};

const pad=n=>String(n).padStart(2,'0');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function todayStr(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
const ymOf=d=>d.slice(0,7);
function addMonths(ym,k){let y=+ym.slice(0,4),m=+ym.slice(5,7)-1+k;y+=Math.floor(m/12);m=((m%12)+12)%12;return y+'-'+pad(m+1)}
const dim=ym=>new Date(+ym.slice(0,4),+ym.slice(5,7),0).getDate();
const dateIn=(ym,d)=>ym+'-'+pad(Math.min(Math.max(1,parseInt(d)||1),dim(ym)));
const lastDay=ym=>dateIn(ym,31);
const monthDiff=(a,b)=>(+b.slice(0,4)-+a.slice(0,4))*12+(+b.slice(5,7)-+a.slice(5,7));
const mIdx=ym=>+ym.slice(5,7)-1;
const fmtYm=ym=>MOIS[mIdx(ym)]+' '+ym.slice(0,4);
const fmtMY=ym=>ym.slice(5,7)+'/'+ym.slice(0,4);
const fmtD=d=>d.slice(8,10)+'/'+d.slice(5,7);
const fmtDL=d=>d?d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4):'';
function addDays(ds,k){const d=new Date(+ds.slice(0,4),+ds.slice(5,7)-1,+ds.slice(8,10)+k);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
const NF=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'});
function moneyTxt(n,sign){n=Math.round((+n||0)*100)/100;if(Object.is(n,-0))n=0;const s=NF.format(n);return sign&&n>0?'+'+s:s}
function money(n,sign){return '<span class="m">'+moneyTxt(n,sign)+'</span>'}
function kmoney(n){if(S&&S.settings.hide)return '•••';const a=Math.abs(n);return (n<0?'-':'')+(a>=1000?(Math.round(a/100)/10).toString().replace('.',',')+'k':Math.round(a).toString())}
const num=v=>{const x=parseFloat(String(v??'').replace(/[\s\u202f€]/g,'').replace(',','.'));return isFinite(x)?x:0};
const r2=x=>Math.round((+x||0)*100)/100;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200)}

/* ================= Données ================= */
const DEF_SET={danger:0,vigilOn:false,vigil:300,revenuRef:0,colIn:'',colOut:'',colDanger:'',colVigil:'',hide:false,hideOnOpen:false,lastBackup:''};
function blank(){return{v:2,settings:Object.assign({},DEF_SET),accounts:[],savings:[],recurring:[],loans:[],oneoffs:[],snapshots:[],overrides:{},categories:null}}
function migrate(){
  const old=S.settings||{};
  S.settings=Object.assign({},DEF_SET,old);
  if(old.danger===undefined&&old.seuil!==undefined)S.settings.danger=num(old.seuil);
  delete S.settings.seuil;
  if(!Array.isArray(S.categories)){
    const used=[...S.recurring.map(r=>r.cat),...S.oneoffs.filter(o=>!o.env).map(o=>o.cat)].filter(Boolean);
    S.categories=[...new Set([...used,...CATS])];
  }
  if(S.accounts.length&&!S.recurring.some(r=>r.kind==='enveloppe'&&r.daily))
    S.recurring.push({id:uid(),kind:'enveloppe',daily:true,label:'Dépenses du quotidien',amount:0,bucket:S.accounts[0].id,months:Array(12).fill(true)});
  S.v=2;
}
function load(){try{const r=localStorage.getItem(KEY);S=r?Object.assign(blank(),JSON.parse(r)):blank()}catch(e){S=blank()}migrate()}
function applyColors(){const st=document.documentElement.style;[['--in','colIn'],['--out','colOut'],['--danger','colDanger'],['--vigil','colVigil']].forEach(([v,k])=>{if(S.settings[k])st.setProperty(v,S.settings[k]);else st.removeProperty(v)});document.body.classList.toggle('hide',!!S.settings.hide)}
function level(v){const st=S.settings;if(v<num(st.danger))return 'danger';if(st.vigilOn&&v<num(st.vigil))return 'vigil';return 'ok'}
function addCat(c){c=(c||'').trim();if(c&&!S.categories.some(x=>x.toLowerCase()===c.toLowerCase()))S.categories.push(c);return c}
function commit(){memo={};bmemo={};try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('⚠ Impossible d\'enregistrer les données')}applyColors();render()}

function buckets(){const out=[];S.accounts.forEach(a=>{out.push({key:a.id,acc:a,name:a.name,sub:null});(a.subs||[]).forEach(s=>out.push({key:a.id+'/'+s.id,acc:a,name:a.name+' › '+s.name,sub:s}))});return out}
function bucketName(k){const b=buckets().find(x=>x.key===k);return b?b.name:'(compte supprimé)'}
function savingName(id){const s=S.savings.find(x=>x.id===id);return s?s.label:'(épargne)'}
function destName(k){return k&&k.startsWith('S:')?savingName(k.slice(2)):bucketName(k)}
const accOf=k=>(k||'').split('/')[0];
const scopeHas=(sc,k)=>sc==='all'||accOf(k)===sc;
function scopeBuckets(sc){return buckets().filter(b=>scopeHas(sc,b.key)).map(b=>b.key)}

function recActive(r,ym){if(r.active===false)return false;if(r.start&&ym<r.start)return false;if(r.end&&ym>r.end)return false;const ms=r.months;return !Array.isArray(ms)||ms.length!==12||!!ms[mIdx(ym)]}
function ov(ym,id){const o=S.overrides[ym];return o&&Object.prototype.hasOwnProperty.call(o,id)?o[id]:undefined}
function setOv(ym,id,v){if(!S.overrides[ym])S.overrides[ym]={};if(v===undefined)delete S.overrides[ym][id];else S.overrides[ym][id]=v;if(!Object.keys(S.overrides[ym]).length)delete S.overrides[ym]}

/* ================= Crédits ================= */
function loanCalc(l){
  const C=num(l.capital),n=parseInt(l.duration)||0,r=num(l.rate)/1200,ins=num(l.insurance);
  const theo=n&&C?(r?C*r/(1-Math.pow(1+r,-n)):C/n):0;
  const total=num(l.payment)>0?num(l.payment):theo+ins;
  const pmt=num(l.payment)>0&&C?Math.max(0,num(l.payment)-ins):theo;
  return{C,n,r,pmt,ins,total};
}
/* Tableau d'amortissement, recalé sur le capital restant dû constaté si saisi */
function loanSchedule(l){
  const{C,n,r,pmt}=loanCalc(l);const rows=[];if(!l.start||!n)return rows;
  let cap=C;
  for(let k=0;k<n;k++){const it=cap*r;const pr=Math.min(cap,Math.max(0,pmt-it));cap=Math.max(0,cap-pr);rows.push({k,ym:addMonths(l.start,k),date:dateIn(addMonths(l.start,k),l.day||1),int:it,princ:pr,rest:cap})}
  const crd=num(l.crdValue);
  if(l.crdDate&&String(l.crdValue??'')!==''&&C){
    const k0=rows.filter(x=>x.date<=l.crdDate).length;
    if(k0>0&&k0<=n){
      const thPr=rows.slice(0,k0).reduce((s,x)=>s+x.princ,0);const realPr=Math.max(0,C-crd);const f=thPr>0?realPr/thPr:0;
      let c2=C;for(let k=0;k<k0;k++){const x=rows[k];x.princ=x.princ*f;x.int=Math.max(0,pmt-x.princ);c2=Math.max(0,c2-x.princ);x.rest=c2}
      rows[k0-1].rest=crd;cap=crd;
      for(let k=k0;k<n;k++){const x=rows[k];const it=cap*r;const pr=k===n-1?cap:Math.min(cap,Math.max(0,pmt-it));cap=Math.max(0,cap-pr);x.int=it;x.princ=pr;x.rest=cap}
    }
  }
  return rows;
}
function loanStatus(l,refDate){
  const T=refDate||todayStr();const c=loanCalc(l);const sch=loanSchedule(l);
  const paid=sch.filter(x=>x.date<=T).length;const done=sch.slice(0,paid),todo=sch.slice(paid);
  const capPaid=done.reduce((s,x)=>s+x.princ,0),intPaid=done.reduce((s,x)=>s+x.int,0);
  const intLeft=todo.reduce((s,x)=>s+x.int,0);
  const rest=paid?sch[paid-1].rest:c.C;
  const curRow=sch.find(x=>x.ym===ymOf(T))||null;
  return Object.assign({},c,{sch,paid,left:Math.max(0,c.n-paid),amountPaid:paid*c.total,capPaid,intPaid,insPaid:paid*c.ins,intLeft,insLeft:Math.max(0,c.n-paid)*c.ins,rest,curRow,end:l.start&&c.n?addMonths(l.start,c.n-1):'',totalInt:sch.reduce((s,x)=>s+x.int,0)});
}
function loanActive(l,ym){if(!l.start)return false;const k=monthDiff(l.start,ym);return k>=0&&k<loanCalc(l).n}

/* ================= Moteur d'opérations ================= */
function monthEvents(ym){
  if(memo[ym])return memo[ym];
  const T=todayStr(),cur=ymOf(T),ev=[];
  for(const r of S.recurring){
    if(!recActive(r,ym))continue;
    const o=ov(ym,r.id);const amt=o===undefined?num(r.amount):num(o);const ovd=o!==undefined;
    const date=dateIn(ym,r.day||1);
    const base={src:r.id,type:'rec',date,label:r.label,bucket:r.bucket,note:r.note,overridden:ovd};
    if(r.kind==='enveloppe')continue; /* un budget est un prévisionnel : jamais débité */
    if(!amt)continue;
    if(r.kind==='charge')ev.push(Object.assign(base,{id:r.id+ym,kind:'charge',amount:-amt,cat:r.cat||'Divers'}));
    else if(r.kind==='revenu')ev.push(Object.assign(base,{id:r.id+ym,kind:'revenu',amount:amt,cat:'Revenus'}));
    else if(r.kind==='virement'){
      if(r.to&&r.to.startsWith('S:'))ev.push(Object.assign(base,{id:r.id+ym,kind:'epargne',amount:-amt,saving:r.to.slice(2),cat:'Épargne'}));
      else{ev.push(Object.assign({},base,{id:r.id+ym,kind:'virement',amount:-amt,pair:r.to,cat:'Virements'}));
        if(r.to)ev.push(Object.assign({},base,{id:r.id+ym+'in',kind:'virement',amount:amt,bucket:r.to,pair:r.bucket,cat:'Virements'}))}
    }
  }
  for(const l of S.loans){
    if(!loanActive(l,ym))continue;
    const o=ov(ym,l.id);const amt=o===undefined?loanCalc(l).total:num(o);if(!amt)continue;
    ev.push({id:l.id+ym,src:l.id,type:'loan',kind:'credit',date:dateIn(ym,l.day||1),label:l.label,amount:-amt,bucket:l.bucket,cat:'Crédits',note:l.note,overridden:o!==undefined});
  }
  for(const x of S.oneoffs){
    if(ymOf(x.date)!==ym)continue;
    const env=x.env?S.recurring.find(r=>r.id===x.env):null;
    ev.push({id:'o'+x.id,src:x.id,type:'oneoff',kind:x.env?'depense':(num(x.amount)>=0?'rentree':'ponctuel'),date:x.date,label:x.label||(env?env.label:'Opération'),amount:num(x.amount),bucket:x.bucket,cat:env?env.label:(x.cat||(num(x.amount)>=0?'Rentrées':'Ponctuels')),note:x.note});
  }
  ev.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.amount>b.amount?-1:1));
  return memo[ym]=ev;
}
function visibleEvents(list,sc){return list.filter(e=>scopeHas(sc,e.bucket)&&!(sc==='all'&&e.kind==='virement'&&e.amount>0))}

/* ================= Soldes ================= */
function snapFor(key,date){let best=null;for(const s of S.snapshots){if(s.date<=date&&s.values&&Object.prototype.hasOwnProperty.call(s.values,key)&&(!best||s.date>best.date))best=s}return best}
function bucketBal(key,date){
  const mk=key+'|'+date;if(mk in bmemo)return bmemo[mk];
  const sn=snapFor(key,date);let bal=0,from;
  if(sn){bal=num(sn.values[key]);from=sn.date}else{from=ymOf(todayStr())+'-00';if(date<from)return bmemo[mk]=0}
  let ym=ymOf(from);const end=ymOf(date);let g=0;
  while(ym<=end&&g++<1200){for(const e of monthEvents(ym))if(e.bucket===key&&e.date>from&&e.date<=date)bal+=e.amount;ym=addMonths(ym,1)}
  return bmemo[mk]=bal;
}
function scopeBal(sc,date){return scopeBuckets(sc).reduce((s,k)=>s+bucketBal(k,date),0)}
function accBal(accId,date){return scopeBuckets(accId).reduce((s,k)=>s+bucketBal(k,date),0)}
function lowPoint(sc,ym){const T=todayStr(),cur=ymOf(T);if(ym<cur)return null;const d0=ym===cur?+T.slice(8):1;let best=null;for(let d=d0;d<=dim(ym);d++){const ds=ym+'-'+pad(d);const b=scopeBal(sc,ds);if(!best||b<best.v-0.001)best={v:b,d:ds}}return best}
function hasSnapshots(){return S.snapshots.length>0}

/* ================= Épargne ================= */
function savingProj(sv,target,withInt){
  let bal=num(sv.balance);const from=sv.updated||todayStr();if(target<=from)return bal;
  let ym=ymOf(from);const end=ymOf(target);const rate=num(sv.rate);let g=0;
  while(ym<=end&&g++<1200){
    if(withInt&&ym>ymOf(from))bal+=bal*rate/1200;
    for(const e of monthEvents(ym))if(e.kind==='epargne'&&e.saving===sv.id&&e.date>from&&e.date<=target)bal-=e.amount;
    ym=addMonths(ym,1);
  }
  return bal;
}
function monthlyIn(sv,ym){return monthEvents(ym).filter(e=>e.kind==='epargne'&&e.saving===sv.id).reduce((s,e)=>s-e.amount,0)}

/* ================= Graphiques ================= */
function barsSvg(vals,labels){
  const W=340,H=160,top=14,bot=22;const mx=Math.max(0,...vals),mn=Math.min(0,...vals);const rng=(mx-mn)||1;const bw=W/vals.length;
  const y=v=>top+(mx-v)/rng*(H-top-bot);const y0=y(0);
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart"><line x1="0" x2="${W}" y1="${y0}" y2="${y0}" stroke="var(--line)"/>`;
  vals.forEach((v,i)=>{const x=i*bw+3,w=bw-6,yy=Math.min(y(v),y0),h=Math.max(1.5,Math.abs(y(v)-y0));
    const lv=level(v);const col=lv==='danger'?'var(--danger)':lv==='vigil'?'var(--vigil)':'var(--accent)';
    s+=`<rect x="${x}" y="${yy}" width="${w}" height="${h}" rx="3" fill="${col}"/>`;
    s+=`<text x="${x+w/2}" y="${v>=0?yy-3:yy+h+9}" font-size="8" text-anchor="middle" fill="var(--muted)">${kmoney(v)}</text>`;
    s+=`<text x="${x+w/2}" y="${H-6}" font-size="9" text-anchor="middle" fill="var(--muted)">${labels[i]}</text>`});
  return s+'</svg>';
}
function lineSvg(vals,labels){
  const W=340,H=150,top=16,bot=22,px=14;const mx=Math.max(...vals),mn=Math.min(...vals);const rng=(mx-mn)||1;
  const x=i=>px+i*(W-2*px)/Math.max(1,vals.length-1);const y=v=>top+(mx-v)/rng*(H-top-bot);
  const pts=vals.map((v,i)=>x(i)+','+y(v)).join(' ');
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart"><polyline points="${pts}" fill="none" stroke="var(--good)" stroke-width="2.5" stroke-linejoin="round"/>`;
  vals.forEach((v,i)=>{s+=`<circle cx="${x(i)}" cy="${y(v)}" r="2.5" fill="var(--good)"/><text x="${x(i)}" y="${H-6}" font-size="9" text-anchor="middle" fill="var(--muted)">${labels[i]}</text>`});
  s+=`<text x="${x(0)}" y="${y(vals[0])-6}" font-size="9" fill="var(--muted)">${kmoney(vals[0])}</text><text x="${x(vals.length-1)}" y="${y(vals[vals.length-1])-6}" font-size="9" text-anchor="end" fill="var(--text)" font-weight="700">${kmoney(vals[vals.length-1])}</text>`;
  return s+'</svg>';
}
function donutHtml(groups,center){
  const tot=groups.reduce((s,g)=>s+g.v,0);if(tot<=0)return '<p class="muted">Aucune sortie sur ce mois.</p>';
  const R=52,C=2*Math.PI*R;let off=0;let s=`<svg viewBox="0 0 140 140" class="donut"><g transform="rotate(-90 70 70)">`;
  groups.forEach((g,i)=>{const len=g.v/tot*C;s+=`<circle cx="70" cy="70" r="${R}" fill="none" stroke="${PAL[i%PAL.length]}" stroke-width="18" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}"/>`;off+=len});
  s+=`</g><text x="70" y="65" text-anchor="middle" font-size="10" fill="var(--muted)">${esc(center||'Sorties')}</text><text x="70" y="82" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--text)">${S.settings.hide?'•••':moneyTxt(tot)}</text></svg>`;
  const lg=groups.map((g,i)=>`<div><i style="background:${PAL[i%PAL.length]}"></i><span>${esc(g.k)}</span><b>${Math.round(g.v/tot*100)}%</b></div>`).join('');
  return `<div class="donutwrap">${s}<div class="legend">${lg}</div></div>`;
}

/* ================= Rendu ================= */
const KICO={charge:'↓',revenu:'↑',virement:'⇄',epargne:'€',credit:'%',ponctuel:'•',rentree:'+',depense:'−',enveloppe:'~'};
function evRow(e){
  const T=todayStr();const passed=e.date<=T&&!e.forecast;
  const col=e.kind==='virement'?'tr':e.amount>=0?'in':'out';
  let sub=fmtD(e.date)+' · '+esc(bucketName(e.bucket));
  if(e.kind==='virement')sub+=(e.amount<0?' → ':' ← ')+esc(bucketName(e.pair));
  if(e.kind==='epargne')sub+=' → '+esc(savingName(e.saving));
  return `<div class="row" data-act="ev" data-id="${esc(e.id)}" data-ym="${ymOf(e.date)}"><div class="ico ${passed?'done':''} ${col}">${passed?'✓':KICO[e.kind]||'•'}</div><div class="grow"><div class="t">${esc(e.label)}${e.overridden?' <span class="tag">modifié</span>':''}</div><div class="s">${sub}${passed?' · passé':e.forecast?' · prévision':''}</div></div><div class="amt ${col}">${money(e.amount,true)}</div></div>`;
}
function scopeChips(){return `<div class="chips"><button class="chip ${ui.scope==='all'?'on':''}" data-act="scope" data-v="all">Global</button>${S.accounts.map(a=>`<button class="chip ${ui.scope===a.id?'on':''}" data-act="scope" data-v="${a.id}">${esc(a.name)}</button>`).join('')}</div>`}
function monthNav(){return `<div class="monthnav"><button data-act="prevm">‹</button><b data-act="todaym">${fmtYm(ui.ym)}</b><button data-act="nextm">›</button></div>`}
function monthsTxt(ms){if(!Array.isArray(ms)||ms.length!==12||ms.every(Boolean))return 'tous les mois';const off=MC.filter((m,i)=>!ms[i]),on=MC.filter((m,i)=>ms[i]);if(!on.length)return 'aucun mois';return off.length<=5?'sauf '+off.join(', '):on.join(', ')}
function revenusMensuels(ym){if(num(S.settings.revenuRef)>0)return num(S.settings.revenuRef);return S.recurring.filter(r=>r.kind==='revenu'&&recActive(r,ym)).reduce((s,r)=>s+num(r.amount),0)}
function mensualitesCredits(ym){return S.loans.filter(l=>loanActive(l,ym)).reduce((s,l)=>s+loanCalc(l).total,0)}

function nextPay(T){const cur=ymOf(T);for(let i=0;i<3;i++){const e=monthEvents(addMonths(cur,i)).find(x=>x.kind==='revenu'&&x.date>T);if(e)return e.date}return null}
function extremes(sc,from,to){let lo=null,hi=null,d=from,g=0;while(d<=to&&g++<400){const b=scopeBal(sc,d);if(!lo||b<lo.v-0.001)lo={v:b,d};if(!hi||b>hi.v+0.001)hi={v:b,d};d=addDays(d,1)}return{lo,hi}}
const lvlCls=v=>{const l=level(v);return l==='ok'?'':l};
function sortLabel(){return{jour:'Par jour / date',mdesc:'Montant décroissant',masc:'Montant croissant',cat:'Par catégorie',nom:'Par nom'}}
function groupKey(e){return e.kind==='credit'?'Crédits':e.kind==='epargne'?'Épargne':e.kind==='virement'?'Virements':e.cat||'Divers'}

function viewHome(){
  if(!S.accounts.length)return `<h1>Mon budget</h1><div class="card"><p><b>Bienvenue.</b> Commence par créer tes comptes (et leurs sous-comptes), puis ajoute tes revenus, prélèvements, crédits et virements dans l'onglet Lignes.</p><p class="muted">Tout reste stocké sur ce téléphone.</p><div class="btns"><button class="btn" data-act="acc-new">Créer un compte</button><button class="btn ghost" data-act="demo">Voir un exemple</button></div></div>`;
  const T=todayStr(),cur=ymOf(T),ym=ui.ym,sc=ui.scope;const isCur=ym===cur,isPast=ym<cur;

  if(!hasSnapshots())h+=`<div class="alert info">Saisis tes soldes bancaires actuels pour que les calculs partent de ta vraie situation. <button class="link" data-act="soldes">Saisir mes soldes →</button></div>`;
  let label,big,from,to;const pay=isCur?nextPay(T):null;
  if(isCur){from=T;to=pay?addDays(pay,-1):lastDay(cur);if(to<T)to=T;big=scopeBal(sc,T);label='Solde aujourd\'hui'}
  else{from=ym+'-01';to=lastDay(ym);big=scopeBal(sc,to);label=isPast?'Solde fin de mois':'Solde prévu fin de mois'}
  const ex=isPast?null:extremes(sc,from,to);
  const lv=level(big);
  h+=`<div class="hero ${lv}"><button class="eye" data-act="eye" aria-label="Masquer les montants">${S.settings.hide?'👁':'🙈'}</button><div class="lbl">${label}${sc!=='all'?' · '+esc(bucketName(sc)):''}</div><div class="big">${money(big)}</div><div class="sub">`;
  if(ex){h+=`<span>Point haut : <b>${money(ex.hi.v)}</b> le ${fmtD(ex.hi.d)}</span><span>Point bas : <b>${money(ex.lo.v)}</b>${level(ex.lo.v)!=='ok'?' ⚠':''} le ${fmtD(ex.lo.d)}</span>`;
    if(isCur)h+=`<span style="opacity:.85">Période : jusqu'au ${fmtD(to)}${pay?' (veille de la paye)':''}</span>`}
  h+=`</div></div>`;
  if(ex){const ll=level(ex.lo.v);if(ll!=='ok'){const thr=ll==='danger'?num(S.settings.danger):num(S.settings.vigil);const z=ll==='danger'?'zone de danger':'zone de vigilance';
    h+=`<div class="alert ${ll}">⚠ ${ex.lo.d===from&&isCur?'Ton solde est en '+z:'Ton solde passera en '+z+' le <b>'+fmtDL(ex.lo.d)+'</b>'} (sous ${money(thr)}) : ${money(ex.lo.v)}.</div>`}}
  h+=`<div class="btns two" style="margin-top:0"><button class="btn ghost sm" data-act="soldes">Mettre à jour mes soldes</button><button class="btn sm" data-act="newmonth">Nouveau mois</button></div>`;
  const B={};
  if(isCur){
    const lim=addDays(T,7);const up=visibleEvents(monthEvents(cur).concat(monthEvents(addMonths(cur,1))),sc).filter(e=>e.date>T&&e.date<=lim&&!e.forecast);
    B.next7=`<h2>7 prochains jours</h2><div class="list">${up.map(evRow).join('')||'<div class="empty">Rien de prévu.</div>'}</div>`;
  }
  const refD=isCur?T:lastDay(ym);
  let acc=`<h2>Comptes ${isCur?'aujourd\'hui':'fin '+MOIS[mIdx(ym)].toLowerCase()}</h2><div class="list">`;
  S.accounts.filter(a=>sc==='all'||a.id===sc).forEach(a=>{
    const tot=accBal(a.id,refD);
    acc+=`<div class="row" data-act="scope" data-v="${a.id}"><div class="grow"><div class="t">${esc(a.name)}</div>${(a.subs||[]).length?`<div class="s">Principal ${money(bucketBal(a.id,refD))}${a.subs.map(s=>' · '+esc(s.name)+' '+money(bucketBal(a.id+'/'+s.id,refD))).join('')}</div>`:''}</div><div class="amt ${lvlCls(tot)}">${money(tot)}</div></div>`;
  });
  B.accounts=acc+`</div>`;
  const envs=S.recurring.filter(r=>r.kind==='enveloppe'&&!r.daily&&recActive(r,ym)&&scopeHas(sc,r.bucket));
  if(envs.length){let bh=`<h2>Budgets du mois</h2><div class="list">`;

  const rev=revenusMensuels(ym),cred=mensualitesCredits(ym);const te=rev?cred/rev*100:0;

const inAcc=k=>ui.lineAcc==='all'||accOf(k)===ui.lineAcc;
function matchQ(){const q=ui.q.trim().toLowerCase();const f=[...arguments];return !q||f.some(x=>String(x||'').toLowerCase().includes(q))}
function sortBy(list,get){
  const s=ui.sort,a=list.slice();
  a.sort((x,y)=>{const X=get(x),Y=get(y);
    if(s==='mdesc')return Y.amount-X.amount;if(s==='masc')return X.amount-Y.amount;
    if(s==='cat')return (X.cat||'~').localeCompare(Y.cat||'~','fr')||X.label.localeCompare(Y.label,'fr');

    return X.day<Y.day?-1:X.day>Y.day?1:0});

}

function withCatHeaders(items,getCat,rowFn){if(ui.sort!=='cat')return items.map(rowFn).join('');let last=null,h='';items.forEach(it=>{const c=getCat(it)||'Sans catégorie';if(c!==last){h+=`<div class="row" style="cursor:default;background:var(--soft)"><div class="s" style="font-weight:700">${esc(c)}</div></div>`;last=c}h+=rowFn(it)});return h}
function linesListHtml(){

function capacity(ym){
  const val=r=>{const o=ov(ym,r.id);return o===undefined?num(r.amount):num(o)};
  const act=k=>S.recurring.filter(r=>r.kind===k&&recActive(r,ym));
  const rev=act('revenu').reduce((s,r)=>s+val(r),0);
  const ch=act('charge').reduce((s,r)=>s+val(r),0);
  const cr=mensualitesCredits(ym);
  const envs=act('enveloppe');const bud=envs.filter(r=>!r.daily).reduce((s,r)=>s+val(r),0);const daily=envs.filter(r=>r.daily).reduce((s,r)=>s+val(r),0);
  const ep=act('virement').filter(r=>r.to&&r.to.startsWith('S:')).reduce((s,r)=>s+val(r),0);
  return{rev,ch,cr,bud,daily,ep,dispo:rev-ch-cr-bud-daily-ep};
}

    else if(f.t==='sens')o[f.k]=(el.querySelector('.on')||{dataset:{v:'out'}}).dataset.v;

    else if(f.t==='money'||f.t==='number')o[f.k]=el.value.trim()===''?'':num(el.value);
    else if(f.t==='day')o[f.k]=Math.min(31,Math.max(1,parseInt(el.value)||1));
    else o[f.k]=el.value.trim();
    if(f.req&&(o[f.k]===''||o[f.k]===undefined)){toast('Champ requis : '+f.l);el.focus&&el.focus();return null}

  return o;

function loanYearsSvg(sch){
  const years={};sch.forEach(r=>{const y=r.ym.slice(0,4);years[y]=years[y]||{p:0,i:0};years[y].p+=r.princ;years[y].i+=r.int});
  const ys=Object.keys(years);if(!ys.length)return '';const mx=Math.max(...ys.map(y=>years[y].p+years[y].i))||1;
  const W=340,H=140,bot=18,bw=W/ys.length;const step=Math.ceil(ys.length/8);
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart">`;
  ys.forEach((y,i)=>{const v=years[y];const hp=v.p/mx*(H-bot-6),hi=v.i/mx*(H-bot-6);const x=i*bw+1,w=Math.max(1,bw-2);
    s+=`<rect x="${x}" y="${H-bot-hp}" width="${w}" height="${hp}" fill="var(--accent)"/><rect x="${x}" y="${H-bot-hp-hi}" width="${w}" height="${hi}" fill="#7c3aed"/>`;
    if(i%step===0)s+=`<text x="${x+w/2}" y="${H-5}" font-size="8.5" text-anchor="middle" fill="var(--muted)">${y.slice(2)}</text>`});
  return s+`</svg><div class="legend" style="display:flex;gap:14px"><div><i style="background:var(--accent)"></i><span>Capital</span></div><div><i style="background:#7c3aed"></i><span>Intérêts</span></div></div>`;
}
function loanSheet(id){
  const l=S.loans.find(x=>x.id===id);if(!l)return;const st=loanStatus(l);const p=st.n?st.paid/st.n*100:0;const sch=st.sch;
  const insPct=st.total?st.ins/st.total*100:0;const cr=st.curRow;
  const stack=(a,b)=>{const t=a+b||1;return `<div class="stack"><i style="width:${a/t*100}%;background:var(--accent)"></i><i style="width:${b/t*100}%;background:#7c3aed"></i></div>`};
  let h=`<h3>${esc(l.label)}</h3><p class="muted" style="margin:0 0 10px">${esc(bucketName(l.bucket))} · le ${l.day||1} du mois${l.crdDate&&String(l.crdValue??'')!==''?' · recalé sur ta banque au '+fmtDL(l.crdDate):''}</p><div class="bar"><i style="width:${p}%"></i></div><p class="muted" style="margin:6px 0 10px">${st.paid} échéances payées sur ${st.n} · ${Math.round(p)} % · fin ${st.end?fmtYm(st.end):'—'}</p>`;
  h+=`<div class="grid2"><div class="kv"><span>Mensualité</span><b>${money(st.total)}</b>${st.ins?`<br><small style="margin:0">dont assurance ${money(st.ins)} (${insPct.toFixed(0)} %)</small>`:''}</div><div class="kv"><span>Capital · taux</span><b>${st.C?money(st.C):'—'}</b><br><small style="margin:0">${num(l.rate)?String(num(l.rate)).replace('.',',')+' %':'taux non saisi'} · ${st.n} mois</small></div></div>`;
  if(st.C&&sch.length){
    if(cr)h+=`<h2>Échéance de ${MOIS[mIdx(cr.ym)].toLowerCase()}</h2><div class="card"><div class="calcrow"><span>Capital remboursé</span><b class="in">${money(cr.princ)}</b></div><div class="calcrow"><span>Intérêts</span><b>${money(cr.int)}</b></div>${st.ins?`<div class="calcrow"><span>Assurance</span><b>${money(st.ins)}</b></div>`:''}${stack(cr.princ,cr.int)}</div>`;
    h+=`<h2>Déjà remboursé</h2><div class="card"><div class="calcrow"><span>Capital</span><b class="in">${money(st.capPaid)}</b></div><div class="calcrow"><span>Intérêts</span><b>${money(st.intPaid)}</b></div>${st.ins?`<div class="calcrow"><span>Assurance</span><b>${money(st.insPaid)}</b></div>`:''}<div class="calcrow total"><span>Total versé</span><span>${money(st.capPaid+st.intPaid+st.insPaid)}</span></div>${stack(st.capPaid,st.intPaid)}</div>`;
    h+=`<h2>Reste à payer</h2><div class="card"><div class="calcrow"><span>Capital restant dû</span><b>${money(st.rest)}</b></div><div class="calcrow"><span>Intérêts restants</span><b>${money(st.intLeft)}</b></div>${st.ins?`<div class="calcrow"><span>Assurance restante</span><b>${money(st.insLeft)}</b></div>`:''}<div class="calcrow total"><span>Total restant</span><span>${money(st.rest+st.intLeft+st.insLeft)}</span></div>${stack(st.rest,st.intLeft)}<small>Coût total des intérêts sur la durée : ${money(st.totalInt)}</small></div>`;
    h+=`<h2>Capital et intérêts par année</h2><div class="card">${loanYearsSvg(sch)}</div>`;
    h+=`<details><summary>Tableau mensuel complet</summary><table><tr><th>#</th><th>Mois</th><th>Intérêts</th><th>Capital</th><th>Restant</th></tr>${sch.map(r=>`<tr style="${r.k<st.paid?'opacity:.55':''}"><td>${r.k+1}</td><td>${fmtMY(r.ym)}</td><td>${money(r.int)}</td><td>${money(r.princ)}</td><td>${money(r.rest)}</td></tr>`).join('')}</table></details>`;
  }else h+=`<p class="muted">Saisis le capital emprunté et le taux pour voir la décomposition capital / intérêts.</p>`;
  if(l.note)h+=`<p class="note muted">${esc(l.note)}</p>`;
  h+=`<div class="btns"><button class="btn" data-act="loan-edit" data-id="${id}">Modifier</button><button class="btn ghost" data-act="close">Fermer</button></div>`;
  sheet(h);
}
function ovSheet(src,ym,label,base,isLoan,extra){
  const cur=ov(ym,src);
  sheet(`<h3>${esc(label)}</h3><p class="muted" style="margin:0">${fmtYm(ym)}</p>${extra||''}<div class="fl"><span>Montant pour ${MOIS[mIdx(ym)].toLowerCase()} ${ym.slice(0,4)} uniquement</span><input id="ovamt" inputmode="decimal" value="${String(r2(cur===undefined?base:num(cur))).replace('.',',')}"><small>Montant habituel : ${money(base)}</small></div>
  <div class="btns"><button class="btn" data-act="ov-save" data-src="${src}" data-ym="${ym}">Enregistrer pour ce mois</button>${cur!==undefined?`<button class="btn ghost" data-act="ov-reset" data-src="${src}" data-ym="${ym}">Revenir au montant habituel</button>`:''}<button class="btn ghost" data-act="ov-skip" data-src="${src}" data-ym="${ym}">Pas ce mois-ci</button><button class="btn ghost" data-act="${isLoan?'loan-open':'rec-edit'}" data-id="${src}">Modifier la ligne</button></div>`);
}
function envSheet(id,ym){
  const r=S.recurring.find(x=>x.id===id);if(!r)return;
  const deps=S.oneoffs.filter(o=>o.env===id&&ymOf(o.date)===ym).sort((a,b)=>a.date<b.date?1:-1);
  const o=ov(ym,id);const budget=o===undefined?num(r.amount):num(o);const spent=deps.reduce((s,x)=>s-num(x.amount),0);const p=budget?Math.min(100,spent/budget*100):0;
  sheet(`<h3>${esc(r.label)} · ${fmtYm(ym)}</h3><div class="grid2"><div class="kv"><span>Budget</span><b>${money(budget)}</b></div><div class="kv"><span>Reste</span><b class="${budget-spent<0?'out':''}">${money(budget-spent)}</b></div></div><div class="bar ${spent>budget?'over':''}"><i style="width:${p}%"></i></div><p class="muted">${money(spent)} dépensés · ${esc(bucketName(r.bucket))}</p>
  <div class="btns" style="margin-top:0"><button class="btn" data-act="dep-add" data-id="${id}" data-ym="${ym}">+ Ajouter une dépense</button></div>
  <h2>Dépenses du mois</h2><div class="list">${deps.map(x=>`<div class="row" data-act="dep-edit" data-id="${x.id}"><div class="grow"><div class="t">${esc(x.label)}</div><div class="s">${fmtDL(x.date)}${x.note?' · '+esc(x.note):''}</div></div><div class="amt out">${money(x.amount)}</div></div>`).join('')||'<div class="empty">Aucune dépense saisie. Les dépenses que tu saisis ici débitent le compte à leur date ; le budget lui-même n\'est jamais débité.</div>'}</div>
  <div class="btns"><button class="btn ghost sm" data-act="ovenv" data-id="${id}" data-ym="${ym}">Changer le budget de ce mois</button><button class="btn ghost sm" data-act="rec-edit" data-id="${id}">Modifier l'enveloppe</button></div>`);
}

function balancesSheet(mode){
  if(needAccount())return;
  const T=todayStr();const ym=ui.ym;
  const date=mode==='new'?addDays(ym+'-01',-1):T;
  const bs=buckets();
  let h=`<h3>${mode==='new'?'Nouveau mois · '+fmtYm(ym):'Mettre à jour mes soldes'}</h3><p class="muted" style="margin:0">${mode==='new'?'Vérifie tes soldes de fin du mois précédent et les montants variables de ce mois.':'Recopie les soldes affichés par ta banque. Les opérations datées après cette date seront appliquées par-dessus.'}</p>
  <div class="fl"><span>Soldes au</span><input type="date" id="b_date" value="${date}"></div><div id="balbox">`;
  h+=bs.map(b=>`<div class="balrow"><label>${esc(b.name)}</label><input inputmode="decimal" data-key="${b.key}" value="${String(r2(bucketBal(b.key,date))).replace('.',',')}"></div>`).join('');
  h+=`</div>`;
  if(mode==='new'){
    const vars=S.recurring.filter(r=>['virement','revenu','enveloppe'].includes(r.kind)&&recActive(r,ym));
    if(vars.length){h+=`<h2>Montants de ${MOIS[mIdx(ym)].toLowerCase()}</h2><div id="varbox">${vars.map(r=>{const o=ov(ym,r.id);return `<div class="balrow"><label>${esc(r.label)}<br><small style="margin:0">${KN[r.kind]}${r.kind==='virement'?' → '+esc(destName(r.to)):''}</small></label><input inputmode="decimal" data-rid="${r.id}" value="${String(r2(o===undefined?num(r.amount):num(o))).replace('.',',')}"></div>`}).join('')}</div>`}
  }
  h+=`<div class="btns"><button class="btn" data-act="bal-save" data-mode="${mode}">Enregistrer</button><button class="btn ghost" data-act="close">Annuler</button></div>`;
  sheet(h);
  document.getElementById('b_date').addEventListener('change',e=>{const d=e.target.value;if(!d)return;document.querySelectorAll('#balbox input').forEach(i=>i.value=String(r2(bucketBal(i.dataset.key,d))).replace('.',','))});
}
function saveBalances(mode){
  const date=document.getElementById('b_date').value;if(!date){toast('Date requise');return}
  const values={};document.querySelectorAll('#balbox input').forEach(i=>values[i.dataset.key]=num(i.value));
  const hadPrior=S.snapshots.some(s=>s.date<date);
  S.snapshots=S.snapshots.filter(s=>s.date!==date);memo={};bmemo={};
  const expected={};Object.keys(values).forEach(k=>expected[k]=r2(bucketBal(k,date)));
  const snap={id:uid(),date,values};if(hadPrior)snap.expected=expected;S.snapshots.push(snap);
  if(mode==='new'){const ym=ui.ym;document.querySelectorAll('#varbox input').forEach(i=>{const r=S.recurring.find(x=>x.id===i.dataset.rid);if(!r)return;const v=num(i.value);setOv(ym,r.id,Math.abs(v-num(r.amount))<0.005?undefined:v)})}
  commit();
  if(!hadPrior){closeSheet();toast(mode==='new'?'Mois initialisé':'Soldes enregistrés');return}
  const rows=S.accounts.map(a=>{const keys=Object.keys(values).filter(k=>accOf(k)===a.id);const real=keys.reduce((s,k)=>s+values[k],0),exp=keys.reduce((s,k)=>s+expected[k],0);return{a,real,exp,d:real-exp}});
  const any=rows.some(r=>Math.abs(r.d)>=0.5);
  sheet(`<h3>Soldes enregistrés</h3><p class="muted" style="margin:0 0 10px">Comparaison avec ce que l'appli avait calculé au ${fmtDL(date)}.</p><div class="list">${rows.map(r=>`<div class="row" style="cursor:default"><div class="grow"><div class="t">${esc(r.a.name)}</div><div class="s">Réel ${money(r.real)} · prévu ${money(r.exp)}</div></div><div class="amt ${Math.abs(r.d)<0.5?'':r.d<0?'danger':'in'}">${Math.abs(r.d)<0.5?'✓ OK':money(r.d,true)}</div></div>`).join('')}</div>${any?'<p class="muted">Un écart signale souvent un prélèvement oublié, un montant qui a changé ou une dépense non saisie.</p>':'<p class="muted">Aucun écart : tes lignes sont à jour.</p>'}<div class="btns"><button class="btn" data-act="close">OK</button></div>`);
}

function editAccount(id){
  const a=id?S.accounts.find(x=>x.id===id):{name:'',subs:[]};if(!a)return;
  const subRow=s=>`<div class="subrow" data-sid="${s.id}"><input value="${esc(s.name)}" placeholder="Nom du sous-compte"><button type="button" class="btn ghost sm" data-act="sub-del">✕</button></div>`;
  sheet(`<h3>${id?'Modifier le compte':'Nouveau compte'}</h3><div class="fl"><span>Nom du compte</span><input id="a_name" value="${esc(a.name)}" placeholder="Ex : Compte joint Sumeria"></div>
  <div class="fl"><span>Sous-comptes (cagnottes, onglets…)</span><div id="subs">${(a.subs||[]).map(subRow).join('')}</div><button type="button" class="btn ghost sm" data-act="sub-add">+ Ajouter un sous-compte</button><small>Ex : Nourriture, Voyage, Loisirs. Le solde du compte = principal + sous-comptes.</small></div>
  <div class="btns"><button class="btn" data-act="acc-save" data-id="${id||''}">Enregistrer</button>${id?`<button class="btn danger" data-act="acc-del" data-id="${id}">Supprimer</button>`:''}<button class="btn ghost" data-act="close">Annuler</button></div>`);
}
function rekey(oldK,newK){
  S.recurring.forEach(r=>{if(r.bucket===oldK)r.bucket=newK;if(r.to===oldK)r.to=newK});
  S.loans.forEach(l=>{if(l.bucket===oldK)l.bucket=newK});
  S.oneoffs.forEach(o=>{if(o.bucket===oldK)o.bucket=newK});
  S.snapshots.forEach(s=>{if(s.values&&oldK in s.values){s.values[newK]=num(s.values[newK])+num(s.values[oldK]);delete s.values[oldK]}});
}
function saveAccount(id){
  const name=document.getElementById('a_name').value.trim();if(!name){toast('Donne un nom au compte');return}
  const subs=[...document.querySelectorAll('#subs .subrow')].map(r=>({id:r.dataset.sid,name:r.querySelector('input').value.trim()})).filter(s=>s.name);
  if(id){const a=S.accounts.find(x=>x.id===id);const keep=new Set(subs.map(s=>s.id));(a.subs||[]).forEach(s=>{if(!keep.has(s.id))rekey(id+'/'+s.id,id)});a.name=name;a.subs=subs}
  else S.accounts.push({id:uid(),name,subs});
  commit();closeSheet();toast('Compte enregistré');
}
function deleteAccount(id){
  if(!confirm('Supprimer ce compte et toutes les lignes qui y sont rattachées ?'))return;
  const inAcc=k=>accOf(k)===id;
  S.recurring=S.recurring.filter(r=>!inAcc(r.bucket)&&!(r.to&&!r.to.startsWith('S:')&&inAcc(r.to)));
  S.loans=S.loans.filter(l=>!inAcc(l.bucket));S.oneoffs=S.oneoffs.filter(o=>!inAcc(o.bucket));
  S.snapshots.forEach(s=>Object.keys(s.values||{}).forEach(k=>{if(inAcc(k))delete s.values[k]}));
  S.accounts=S.accounts.filter(a=>a.id!==id);if(ui.scope===id)ui.scope='all';
  commit();closeSheet();
}

/* ================= Sauvegarde ================= */
async function exportData(){
  const name='budget-'+todayStr()+'.json';const txt=JSON.stringify(S,null,1);
  try{const file=new File([txt],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Sauvegarde Mon Budget'});markBackup();return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);markBackup();
}
function markBackup(){S.settings.lastBackup=todayStr();commit();toast('Sauvegarde faite')}
function importData(file){
  const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!d||!Array.isArray(d.accounts))throw 0;if(!confirm('Remplacer toutes les données actuelles par cette sauvegarde ?'))return;S=Object.assign(blank(),d);S.settings=d.settings||{};migrate();commit();toast('Sauvegarde restaurée')}catch(e){toast('Fichier invalide')}};fr.readAsText(file);
}

  'cat-new':()=>{const i=document.getElementById('catNew');if(addCat(i.value)){commit();toast('Catégorie ajoutée')}},
  'cat-edit':t=>{const c=t.dataset.v;sheet(`<h3>Catégorie</h3><div class="fl"><span>Nom</span><input id="catRen" value="${esc(c)}"></div><p class="muted">${S.recurring.filter(r=>r.cat===c).length+S.oneoffs.filter(o=>o.cat===c).length} ligne(s) l'utilisent.</p><div class="btns"><button class="btn" data-act="cat-ren" data-v="${esc(c)}">Renommer</button><button class="btn danger" data-act="cat-del" data-v="${esc(c)}">Supprimer</button><button class="btn ghost" data-act="close">Annuler</button></div>`)},
  'cat-ren':t=>{const o=t.dataset.v,n=document.getElementById('catRen').value.trim();if(!n)return;S.categories=S.categories.map(c=>c===o?n:c).filter((c,i,a)=>a.indexOf(c)===i);S.recurring.forEach(r=>{if(r.cat===o)r.cat=n});S.oneoffs.forEach(x=>{if(x.cat===o)x.cat=n});commit();closeSheet();toast('Catégorie renommée')},
  'cat-del':t=>{const o=t.dataset.v;if(!confirm('Supprimer la catégorie « '+o+' » ? Les lignes concernées n\'auront plus de catégorie.'))return;S.categories=S.categories.filter(c=>c!==o);S.recurring.forEach(r=>{if(r.cat===o)r.cat=''});S.oneoffs.forEach(x=>{if(x.cat===o)x.cat=''});commit();closeSheet()},
  'col-reset':()=>{['colIn','colOut','colDanger','colVigil'].forEach(k=>S.settings[k]='');commit();toast('Couleurs par défaut')},
  'dep-add':t=>editDep(t.dataset.id,t.dataset.ym||ui.ym),
  'dep-edit':t=>{const x=S.oneoffs.find(z=>z.id===t.dataset.id);if(x)editDep(x.env,ymOf(x.date),x.id)},
  ovenv:t=>{const r=S.recurring.find(x=>x.id===t.dataset.id);if(r)ovSheet(r.id,t.dataset.ym,r.label,num(r.amount),false)},
  ev:t=>{
    const ym=t.dataset.ym;const e=monthEvents(ym).find(x=>x.id===t.dataset.id);if(!e)return;
    if(e.type==='oneoff'){const x=S.oneoffs.find(z=>z.id===e.src);if(x&&x.env)return envSheet(x.env,ym);return editOneoff(e.src)}
    if(e.kind==='enveloppe'){const r=S.recurring.find(x=>x.id===e.src);return r&&r.daily?editRec(null,r.id):envSheet(e.src,ym)}
    const passed=e.date<=todayStr();
    const info=`<p class="muted" style="margin:4px 0 0">${fmtDL(e.date)} · ${esc(bucketName(e.bucket))}${e.kind==='virement'?' '+(e.amount<0?'→':'←')+' '+esc(bucketName(e.pair)):''}${e.kind==='epargne'?' → '+esc(savingName(e.saving)):''}</p><p style="margin:6px 0 0">${passed?'✓ Passé (considéré comme débité automatiquement)':'À venir'}</p>${e.note?`<p class="note muted">${esc(e.note)}</p>`:''}`;
    if(e.type==='loan'){const l=S.loans.find(x=>x.id===e.src);return ovSheet(e.src,ym,e.label,loanCalc(l).total,true,info)}
    const r=S.recurring.find(x=>x.id===e.src);ovSheet(e.src,ym,e.label,num(r.amount),false,info);
  },
  'ov-save':t=>{const v=num(document.getElementById('ovamt').value);const src=t.dataset.src,ym=t.dataset.ym;const r=S.recurring.find(x=>x.id===src),l=S.loans.find(x=>x.id===src);const base=r?num(r.amount):l?loanCalc(l).total:0;setOv(ym,src,Math.abs(v-base)<0.005?undefined:v);commit();closeSheet();toast('Montant du mois enregistré')},
  'ov-reset':t=>{setOv(t.dataset.ym,t.dataset.src,undefined);commit();closeSheet()},
  'ov-skip':t=>{setOv(t.dataset.ym,t.dataset.src,0);commit();closeSheet();toast('Ignoré pour ce mois')},
  soldes:()=>balancesSheet('upd'),
  newmonth:()=>balancesSheet('new'),
  'bal-save':t=>saveBalances(t.dataset.mode),
  'snap-del':t=>{if(confirm('Supprimer ce relevé de soldes ?')){S.snapshots=S.snapshots.filter(s=>s.id!==t.dataset.id);commit()}},
  export:exportData,
  import:()=>document.getElementById('importFile').click(),
  reset:()=>{if(confirm('Effacer TOUTES les données de l\'appli ?')&&confirm('Vraiment ? Pense à sauvegarder avant.')){S=blank();migrate();ui.scope='all';commit()}},
  'form-save':()=>{const o=readForm();if(o)FORM.onSave(o)},
  'form-del':()=>FORM&&FORM.onDelete&&FORM.onDelete(),
  mchip:t=>t.classList.toggle('on'),
  mall:t=>document.querySelectorAll('#'+t.dataset.f+' .mchip').forEach(b=>b.classList.add('on')),
  mnone:t=>document.querySelectorAll('#'+t.dataset.f+' .mchip').forEach(b=>b.classList.remove('on')),
  sens:t=>{t.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===t))}
};
document.addEventListener('click',e=>{
  const tab=e.target.closest('.tabbar button');if(tab){ui.edit=false;ui.tab=tab.dataset.tab;ui.calDay=null;render();window.scrollTo(0,0);return}
  const t=e.target.closest('[data-act]');if(!t)return;const f=ACT[t.dataset.act];if(f){e.preventDefault();e.stopPropagation();f(t)}
});
document.addEventListener('change',e=>{const el=e.target;const k=el.dataset&&el.dataset.set;if(k){S.settings[k]=el.type==='checkbox'?el.checked:el.type==='color'?el.value:num(el.value);commit();toast('Réglage enregistré')}
  if(el.id==='sortSel'){ui.sort=el.value;const L=document.getElementById('linesList');if(L)L.innerHTML=linesListHtml()}});
document.addEventListener('input',e=>{if(e.target.id==='q'){ui.q=e.target.value;refreshLines()}});
let lpT=null,lpX=0,lpY=0;
document.addEventListener('pointerdown',e=>{
  if(ui.tab!=='home')return;
  const h=e.target.closest('.blk-h');
  if(ui.edit&&h){startDrag(e,h.closest('.blk'));return}
  if(ui.edit||!e.target.closest('.blk'))return;
  lpX=e.clientX;lpY=e.clientY;clearTimeout(lpT);
  lpT=setTimeout(()=>{ui.edit=true;try{navigator.vibrate&&navigator.vibrate(30)}catch(_){}render()},550);
});
document.addEventListener('pointermove',e=>{if(lpT&&(Math.abs(e.clientX-lpX)>8||Math.abs(e.clientY-lpY)>8)){clearTimeout(lpT);lpT=null}});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,()=>{clearTimeout(lpT);lpT=null}));
document.addEventListener('contextmenu',e=>{if(e.target.closest('.blk'))e.preventDefault()});
function startDrag(e,el){
  e.preventDefault();const main=document.getElementById('main');el.classList.add('dragging');
  const mv=ev=>{const y=ev.clientY;const sibs=[...main.querySelectorAll('.blk:not(.dragging)')];
    for(const b of sibs){const r=b.getBoundingClientRect();if(y<r.top+r.height/2){if(b.previousElementSibling!==el)main.insertBefore(el,b);return}}
    const last=sibs[sibs.length-1];if(last&&last.nextElementSibling!==el)last.after(el);
    if(y<60)window.scrollBy(0,-12);if(y>window.innerHeight-120)window.scrollBy(0,12)};
  const up=()=>{document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',up);el.classList.remove('dragging');
    const vis=[...main.querySelectorAll('.blk')].map(b=>b.dataset.blk);const rest=homeOrder().filter(k=>!vis.includes(k));S.settings.homeOrder=vis.concat(rest);commit()};
  document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
}
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
document.getElementById('importFile').addEventListener('change',e=>{const f=e.target.files[0];if(f)importData(f);e.target.value=''});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){memo={};bmemo={};if(S.settings.hideOnOpen){S.settings.hide=true;applyColors()}render()}});

load();if(S.settings.hideOnOpen)S.settings.hide=true;applyColors();render();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
</script>
</body>
</html>
